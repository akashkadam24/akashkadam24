name: Update experience

on:
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update README
        run: |
          python3 - <<'EOF'
          import re, datetime
          start = datetime.date(2022, 4, 1)
          years = round((datetime.date.today() - start).days / 365.25, 1)
          s = open("README.md").read()
          s = re.sub(r"<!--EXP-->.*?<!--/EXP-->", f"<!--EXP-->{years}<!--/EXP-->", s)
          open("README.md", "w").write(s)
          EOF

      - name: Commit
        run: |
          git config user.name "Akash"
          git config user.email "kadamav007@gmail.com"
          # The repo is kept as a single commit: fold the update into it
          # instead of adding history.
          git diff --quiet || (git commit -a --amend --no-edit && git push --force)
